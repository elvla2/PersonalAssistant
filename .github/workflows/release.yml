name: Build & Release Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js (Desktop Mode)
        env:
          DESKTOP_MODE: 'true'
          NEXT_PUBLIC_DESKTOP_MODE: 'true'
        run: npx next build

      - name: Prepare standalone distribution
        run: node scripts/prepare_standalone.mjs

      - name: Extract version from package.json
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package Desktop App (macOS)
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac --publish never
          cp dist-desktop/Personal-Assistant-*-arm64.dmg dist-desktop/Personal-Assistant-arm64.dmg || true
          cp dist-desktop/Personal-Assistant-*-x64.dmg dist-desktop/Personal-Assistant-x64.dmg || true
          cp dist-desktop/Personal-Assistant-*-arm64.zip dist-desktop/Personal-Assistant-arm64.zip || true
          cp dist-desktop/Personal-Assistant-*-x64.zip dist-desktop/Personal-Assistant-x64.zip || true

      - name: Cloud macOS Simulator (Verify Signing, Mount DMG & Boot GUI)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== 1. Verifying uniform ad-hoc code signatures ==="
          codesign --verify --deep --strict --verbose=2 "dist-desktop/mac-arm64/Personal Assistant.app"
          if [ -d "dist-desktop/mac/Personal Assistant.app" ]; then
            codesign --verify --deep --strict --verbose=2 "dist-desktop/mac/Personal Assistant.app"
          fi
          codesign -d --entitlements - "dist-desktop/mac-arm64/Personal Assistant.app" || true

          echo "=== 2. Mounting Personal-Assistant-arm64.dmg read-only & installing via ditto ==="
          rm -rf /tmp/pa-dmg-mount /tmp/mac-sim-apps /tmp/pa-sim-userdata dist-desktop/mac-simulator
          mkdir -p /tmp/pa-dmg-mount /tmp/mac-sim-apps /tmp/pa-sim-userdata dist-desktop/mac-simulator
          hdiutil attach dist-desktop/Personal-Assistant-arm64.dmg -nobrowse -readonly -mountpoint /tmp/pa-dmg-mount
          ditto "/tmp/pa-dmg-mount/Personal Assistant.app" "/tmp/mac-sim-apps/Personal Assistant.app"
          hdiutil detach /tmp/pa-dmg-mount || hdiutil detach -force /tmp/pa-dmg-mount || true

          echo "=== 3. Re-verifying signature after DMG copy ==="
          codesign --verify --deep --strict "/tmp/mac-sim-apps/Personal Assistant.app"

          echo "=== 4. Booting real Personal Assistant.app on Cloud macOS Simulator ==="
          set +e
          PA_SMOKE_TEST=1 \
          LOCAL_DB_DIR=/tmp/pa-sim-userdata \
          PA_SMOKE_SCREENSHOT_PATH="$PWD/dist-desktop/mac-simulator/mac-simulator-screenshot.png" \
          PA_SMOKE_REPORT_PATH="$PWD/dist-desktop/mac-simulator/mac-simulator-report.json" \
          "/tmp/mac-sim-apps/Personal Assistant.app/Contents/MacOS/Personal Assistant" \
          > dist-desktop/mac-simulator/simulator-stdout.log 2>&1
          SIM_EXIT=$?
          set -e

          cat dist-desktop/mac-simulator/simulator-stdout.log

          if [ $SIM_EXIT -ne 0 ]; then
            echo "::error::Cloud macOS Simulator failed with exit code $SIM_EXIT"
            ls -la ~/Library/Logs/DiagnosticReports/ || true
            for crash in ~/Library/Logs/DiagnosticReports/*Personal* ~/Library/Logs/DiagnosticReports/*Electron*; do
              if [ -f "$crash" ]; then
                echo "=== Crash Report: $crash ==="
                head -n 120 "$crash"
              fi
            done
            exit $SIM_EXIT
          fi

          echo "=== 5. Validating Cloud macOS Simulator Report & Screenshot ==="
          test -f dist-desktop/mac-simulator/mac-simulator-report.json
          cat dist-desktop/mac-simulator/mac-simulator-report.json
          ls -lh dist-desktop/mac-simulator/mac-simulator-screenshot.png

      - name: Upload Cloud macOS Simulator Proof
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-cloud-simulator-proof
          path: dist-desktop/mac-simulator/*
          if-no-files-found: warn

      - name: Package Desktop App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx electron-builder --win --publish never
          Get-ChildItem dist-desktop/Personal-Assistant-Setup-*.exe | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName dist-desktop/Personal-Assistant-Setup.exe -Force }
          Get-ChildItem dist-desktop/Personal-Assistant-Portable-*.exe | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName dist-desktop/Personal-Assistant-Portable.exe -Force }

      - name: Upload Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: personal-assistant-${{ matrix.os }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
          if-no-files-found: warn

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.pkg.outputs.version) }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.pkg.outputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
